# model-rheostat-plugin bundle patch：向组合插入 model-rheostat-plugin 行。
#
# Host 半边是空 apply（这个插件是纯浏览器侧的界面控件）；它的存在只是为了让
# 客户端的 dsh-client-modules 扫描器看到本包的 dsh.client 声明，从而把
# .dsh-plugin/client.js 作为浏览器 bundle 提供给页面。
#
# 恢复预案：在 profile 的 cordis.patch.yml 里加
#   - id: model-rheostat
#     disabled: true
# 即可隔离本插件，无需卸载。
- insert:
    - id: model-rheostat
      name: model-rheostat-plugin
